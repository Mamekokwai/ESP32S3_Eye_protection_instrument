# ============================================================
#  ESP32-S3 AVI 视频转换配置文件
#  用法: ./convert.sh video.mp4          (单文件)
#        ./convert.sh                     (批量转换下面列表)
# ============================================================

# --- 视频输出参数 ---

# 最大分辨率 (超出会等比缩放 + 加黑边)
MAX_WIDTH=320
MAX_HEIGHT=320

# 帧率 (设为 0 保持原始帧率)
FPS=0

# JPEG 质量 (2=最高, 31=最低, 推荐 3~10)
#   q:v  3 → 单帧 ~25KB, 解码 ~13ms, 画质好
#   q:v 10 → 单帧 ~8KB,  解码 ~12ms, 画质可接受
#   q:v 20 → 单帧 ~3KB,  解码 ~10ms, 画质差有马赛克
JPEG_QUALITY=10

# --- 音频参数 ---

# 是否包含音频 (0=无音频, 1=保留音频)
# 注意: ES8311 DAC 固定 16000Hz 单声道, 其他格式会静音或变速
ENABLE_AUDIO=0

# 音频采样率 (仅 ENABLE_AUDIO=1 时生效)
AUDIO_RATE=16000

# 音频声道数 (仅 ENABLE_AUDIO=1 时生效, 1=单声道)
AUDIO_CHANNELS=1

# --- 输入文件列表 (批量转换时使用) ---

# 格式: 一行一个文件路径, # 开头为注释
# 输出文件自动命名为: 输入文件名.avi (放在同目录)
FILES=(
    # "/home/nywerya/Videos/SDcard/VIDEO/散光1.mp4"
    # "/path/to/another/video.mp4"
