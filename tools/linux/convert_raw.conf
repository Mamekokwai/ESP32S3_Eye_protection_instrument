# ============================================================
#  ESP32-S3 RAW 视频转换配置文件 (RGB565 原始格式)
#  用法: ./convert_raw.sh video.mp4          (单文件)
#        ./convert_raw.sh                     (批量转换下面列表)
# ============================================================

# --- 视频输出参数 ---

# 输出分辨率 WxH (必须 ≤ 320×240)
SIZE=240x160

# 输出帧率 (raw_player 建议 15~30)
FPS=15

# --- 输入文件列表 (批量转换时使用) ---

# 格式: 一行一个文件路径, # 开头为注释
# 输出文件自动命名为: 输入文件名.raw (放在同目录)
FILES=(
    # "/home/nywerya/Videos/SDcard/VIDEO/散光1.mp4"
    # "/path/to/another/video.mp4"
)
