# ============================================================
#  ESP32-S3 AVI 视频转换配置文件
#  用法: ./convert.sh video.mp4          (单文件)
#        ./convert.sh                     (批量转换下面列表)
# ============================================================

# --- 视频输出参数 ---

# 最大分辨率 (超出会等比缩放 + 加黑边)
MAX_WIDTH=320
MAX_HEIGHT=240

# 帧率 (设为 0 保持原始帧率)
FPS=0

# JPEG 质量 (2=最高, 10=最低, 推荐 3~5)
#   q:v 3 → 单帧 ~20-30KB, 解码 ~90ms
#   q:v 5 → 单帧 ~10-15KB, 解码 ~60ms
JPEG_QUALITY=3

# --- 音频参数 ---

# 是否包含音频 (0=无音频, 1=保留音频)
# 注意: ES8311 DAC 固定 16000Hz 单声道, 其他格式会静音或变速
ENABLE_AUDIO=0

# 音频采样率 (仅 ENABLE_AUDIO=1 时生效)
AUDIO_RATE=16000

# 音频声道数 (仅 ENABLE_AUDIO=1 时生效, 1=单声道)
AUDIO_CHANNELS=1

# --- 输入文件列表 (批量转换时使用) ---

# 格式: 一行一个文件路径, # 开头为注释
# 输出文件自动命名为: 输入文件名.avi (放在同目录)
FILES=(
    # "/home/nywerya/Videos/SDcard/VIDEO/散光1.mp4"
    # "/path/to/another/video.mp4"
    "/home/nywerya/Videos/SDcard/VIDEO/散光1.mp4"
)
