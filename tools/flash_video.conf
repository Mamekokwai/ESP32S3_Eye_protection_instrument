# ============================================================
#  Flash 多媒体烧录配置
#  用法: ./flash_video.sh                       (烧录下面 FILES)
#        ./flash_video.sh a.avi b.jpg c.avi     (参数覆盖配置)
# ============================================================

# --- 烧录参数 ---

# 串口 (默认 /dev/ttyUSB0)
PORT=/dev/ttyUSB0

# 烧录波特率 (115200 稳定)
BAUD=115200

# --- 兼容旧版的单视频配置 ---
FILE="/home/nywerya/Videos/SDcard/VIDEO/散光1_320x320_30fps_JQ10.avi"

# --- 多文件配置：顺序即Flash存放顺序 ---
FILES=(
    "$FILE"
    # "/path/to/image1.jpg"
    # "/path/to/video2.avi"
)
