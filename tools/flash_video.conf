# ============================================================
#  Flash 视频烧录配置
#  用法: ./flash_video.sh               (烧录下面 FILE)
#        ./flash_video.sh video.avi     (烧录指定文件)
# ============================================================

# --- 烧录参数 ---

# 串口 (默认 /dev/ttyACM0)
PORT=/dev/ttyACM0

# 烧录波特率 (921600 较快, 有问题可降到 460800)
BAUD=921600

# --- 要烧录的视频文件 ---
FILE="/home/nywerya/Videos/SDcard/VIDEO/散光2_320x240_30fps_JQ20.avi"
