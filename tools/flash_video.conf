# ============================================================
#  Flash 视频烧录配置
#  用法: ./flash_video.sh               (烧录下面 FILE)
#        ./flash_video.sh video.avi     (烧录指定文件)
# ============================================================

# --- 烧录参数 ---

# 串口 (默认 /dev/ttyUSB0)
PORT=/dev/ttyUSB0

# 烧录波特率 (115200 稳定)
BAUD=115200

# --- 要烧录的视频文件 ---
FILE="/home/nywerya/Videos/SDcard/VIDEO/散光1_320x320_30fps_JQ10.avi"
